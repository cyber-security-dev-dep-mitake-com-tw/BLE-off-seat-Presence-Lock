name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (default: Cargo.toml / tag)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG / PKG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: Build DMG and PKG
        run: |
          chmod +x packaging/macos/build.sh
          packaging/macos/build.sh "${{ steps.ver.outputs.version }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.sha256
            dist/macos/*.app

  windows:
    name: Windows EXE / MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) {
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            $wix = Join-Path $wix "bin"
          }
          echo "WIX_BIN=$wix" >> $env:GITHUB_ENV
          echo $wix >> $env:GITHUB_PATH
          Write-Host "WiX bin: $wix"
          & "$wix\candle.exe" -?

      - name: Install cargo-wix
        shell: pwsh
        run: cargo install cargo-wix --locked --version 0.3.9

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package portable EXE
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          $exeSrc = "target/release/ble-presence-lock.exe"
          $exeDst = "dist/windows/ble-presence-lock-$ver-x86_64-pc-windows-msvc.exe"
          Copy-Item $exeSrc $exeDst
          Copy-Item config.example.yaml dist/windows/
          Compress-Archive -Path $exeDst, dist/windows/config.example.yaml `
            -DestinationPath "dist/windows/ble-presence-lock-$ver-x86_64-pc-windows-msvc.zip" -Force
          Get-FileHash $exeDst -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $exeDst -Leaf)" } |
            Set-Content "dist/windows/ble-presence-lock-$ver-x86_64.sha256"

      - name: Build MSI
        shell: pwsh
        run: |
          cargo wix --nocapture --package ble-presence-lock
          $ver = "${{ steps.ver.outputs.version }}"
          $msi = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI produced in target/wix" }
          $dst = "dist/windows/ble-presence-lock-$ver-x86_64.msi"
          Copy-Item $msi.FullName $dst
          Get-FileHash $dst -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $dst -Leaf)" } |
            Add-Content "dist/windows/ble-presence-lock-$ver-x86_64.sha256"
          Get-ChildItem dist/windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: artifacts/windows

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          # Prefer installers over raw .app bundle for the release assets.
          cp artifacts/macos/*.dmg artifacts/macos/*.pkg artifacts/macos/*.sha256 release/ || true
          cp artifacts/windows/*.exe artifacts/windows/*.msi artifacts/windows/*.zip artifacts/windows/*.sha256 release/ || true
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BLE Presence Lock ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
