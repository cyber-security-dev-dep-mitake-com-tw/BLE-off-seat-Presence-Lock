[package]
name = "ble-presence-lock"
version = "0.1.0"
edition = "2021"
authors = ["BLE Presence Lock Contributors"]
description = "Cross-platform BLE presence detection daemon with auto screen lock"
license = "Apache-2.0"
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "A7C3E1F2-9B4D-4E8A-8F2C-1D5E6A7B8C9D"
path-guid = "C0FFEE00-1234-5678-9ABC-DEF012345678"
license = false
eula = false

[dependencies]
btleplug = { version = "0.12", features = ["serde"] }
eframe = { version = "0.35", features = ["glow"] }
egui = "0.35"
tray-icon = "0.24"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
futures = "0.3"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Shutdown"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3
