# BLE Presence Lock — example configuration
# Copy to config.yaml next to the binary, or pass --config <PATH>.

device_name: "iPhone"
rssi_threshold: -80
grace_period: 10
ema_alpha: 0.2
scan_interval: 2
log_level: "info"
auto_start: true
device_whitelist: []

# Optional: mock RSSI file (used with --mock)
# debug_mock_file: "/tmp/rssi_mock.txt"
